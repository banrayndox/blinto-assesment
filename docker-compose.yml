version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: doomsday-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: doomsday-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/doomsday_ready
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: doomsday-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
